name: Terraform Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      terraform_format: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.terraform_format }}
      terraform_lint: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.terraform_lint }}
      terraform_validate: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.terraform_validate }}
      user_data_template: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.user_data_template }}
      network_data_template: ${{ github.event_name == 'workflow_dispatch' || steps.paths.outputs.network_data_template }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 20
          persist-credentials: false

      - name: Classify changed paths
        id: paths
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          base: ${{ github.ref }}
          filters: |
            terraform_format:
              - '**/*.tf'
              - '**/*.tf.json'
              - '**/*.tfvars'
              - '**/*.tfvars.json'
              - '**/*.tftest.hcl'
              - '.github/workflows/_tf-lint.yml'
            terraform_lint:
              - '*.tf'
              - '*.tf.json'
              - '.tflint.hcl'
              - '.github/workflows/_tf-lint.yml'
            terraform_validate:
              - '*.tf'
              - '*.tf.json'
              - 'tests/*.tftest.hcl'
              - '.github/workflows/_tf-lint.yml'
            user_data_template:
              - 'main.tf'
              - 'variables.tf'
              - 'templates/user-data-cloud-config.tftpl'
              - 'tests/template-validation/main.tf'
              - 'tests/template-validation/validate.sh'
              - '.github/workflows/_tf-lint.yml'
            network_data_template:
              - 'main.tf'
              - 'variables.tf'
              - 'templates/network-data-cloud-config.tftpl'
              - 'tests/template-validation/main.tf'
              - 'tests/template-validation/validate.sh'
              - '.github/workflows/_tf-lint.yml'

  terraform:
    name: Terraform checks
    needs: changes
    if: >-
      needs.changes.outputs.terraform_format == 'true' ||
      needs.changes.outputs.terraform_lint == 'true' ||
      needs.changes.outputs.terraform_validate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        if: >-
          needs.changes.outputs.terraform_format == 'true' ||
          needs.changes.outputs.terraform_validate == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: needs.changes.outputs.terraform_format == 'true'
        run: terraform fmt -check -recursive -diff

      - name: Setup TFLint
        if: needs.changes.outputs.terraform_lint == 'true'
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Run TFLint
        if: needs.changes.outputs.terraform_lint == 'true'
        run: tflint --format=compact --no-color

      - name: Initialize Terraform
        if: needs.changes.outputs.terraform_validate == 'true'
        run: terraform init -backend=false -input=false -no-color

      - name: Validate Terraform
        if: needs.changes.outputs.terraform_validate == 'true'
        run: terraform validate -no-color

      - name: Run Terraform tests
        if: needs.changes.outputs.terraform_validate == 'true'
        run: terraform test -no-color

  templates:
    name: Cloud-init template checks
    needs: changes
    if: >-
      needs.changes.outputs.user_data_template == 'true' ||
      needs.changes.outputs.network_data_template == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Check validation harness
        run: |
          bash -n tests/template-validation/validate.sh
          shellcheck tests/template-validation/validate.sh

      - name: Install Cloud-init
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes cloud-init

      - name: Check Cloud-init schema support
        shell: bash
        run: |
          set -euo pipefail
          cloud-init --version
          help_text=$(cloud-init schema --help 2>&1)
          [[ "$help_text" == *cloud-config* ]]
          [[ "$help_text" == *network-config* ]]

      - name: Validate changed templates
        shell: bash
        env:
          CHECK_NETWORK_DATA: ${{ needs.changes.outputs.network_data_template }}
          CHECK_USER_DATA: ${{ needs.changes.outputs.user_data_template }}
        run: |
          set -euo pipefail

          targets=()
          if [[ "$CHECK_USER_DATA" == "true" ]]; then
            targets+=(user-data)
          fi
          if [[ "$CHECK_NETWORK_DATA" == "true" ]]; then
            targets+=(network-data)
          fi

          tests/template-validation/validate.sh "${targets[@]}"

  quality-gate:
    name: Terraform quality
    needs:
      - changes
      - terraform
      - templates
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TEMPLATES_RESULT: ${{ needs.templates.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
        run: |
          set -euo pipefail

          [[ "$CHANGES_RESULT" == "success" ]]
          [[ "$TERRAFORM_RESULT" == "success" || "$TERRAFORM_RESULT" == "skipped" ]]
          [[ "$TEMPLATES_RESULT" == "success" || "$TEMPLATES_RESULT" == "skipped" ]]
